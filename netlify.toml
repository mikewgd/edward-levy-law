[build]
  base = "/"
  publish = "build/"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"
  # Google Analytics 4 is opt-in: set VITE_GA_MEASUREMENT_ID (a "G-XXXXXXXXXX" id)
  # in the Netlify site's environment variables to enable it. See README.

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
